# DragonRaid Main Configuration
# Supports hot reload via /dr admin reload

language:
  default: ja_JP
  # If true, attempts to match player's Minecraft client locale (falls back to default)
  per-player-locale: true
  supported:
    - ja_JP
    - en_US

database:
  type: sqlite
  file: dragonraid.db
  pool-size: 4

world:
  end-world-name: world_the_end
  # Replace vanilla first-clear Ender Dragon encounter with DragonRaid Normal
  replace-first-dragon: true
  # Preserve vanilla End Gateway, Dragon Egg, and Exit Portal progression
  preserve-vanilla-progression: true

regions:
  # Main combat arena (default centered at 0, 0 on End main island)
  arena:
    shape: cylinder
    center:
      x: 0.0
      y: 64.0
      z: 0.0
    radius: 120.0
    min-y: 0
    max-y: 256
  # Safe waiting area (obsidian spawn platform) for pre-pull & late joiners
  safe-zone:
    shape: cuboid
    min:
      x: 92.0
      y: 45.0
      z: -8.0
    max:
      x: 108.0
      y: 65.0
      z: 8.0
    spawn-point:
      x: 100.5
      y: 50.0
      z: 0.5
      yaw: 90.0
      pitch: 0.0
  # Falling below this Y level triggers DOWNED state and rescues player onto safe arena ground
  void-y-threshold: 0.0

scaling:
  min-players: 1
  # Recommended party size 1-8; set enforce-max-players: false to allow larger variable raids
  max-players: 8
  enforce-max-players: false
  # Boss HP = base-hp * (1 + hp-alpha * (N - 1))
  hp-alpha: 0.65
  # Crystal / Weak Core HP = base-hp * (1 + object-hp-alpha * (N - 1))
  object-hp-alpha: 0.50
  gimmick:
    # Meteor towers count scales dynamically with N
    tower-base: 1
    tower-per-players: 0.5
    tower-min: 1
    tower-max: 6
    # Spread marker targets ratio of alive players
    spread-ratio: 0.5
    spread-min: 1
    spread-max: 8
    # Crystals spawned per wave
    crystal-base: 4
    crystal-per-additional-player: 0.5
    crystal-max: 10
  solo-fallback:
    enabled: true
    # Stack mechanic damage multiplier when N = 1 (survivable with shield / mitigation)
    stack-damage-multiplier: 0.35
    # Extra seconds before tethered crystals require simultaneous destruction when N = 1
    simultaneous-crystal-grace-seconds: 12.0
    allow-vanilla-totem: true

encounter:
  pull-countdown-seconds: 8
  auto-start-on-arena-enter: true
  # If true, disables /dr start and /dr ready triggers; players must use the Altar GUI
  altar-gui-only: false
  lock-late-joiners-to-safe-zone: true
  altar:
    location:
      x: 0.0
      y: 65.0
      z: 0.0
    interact-radius: 4.0
    unlock-hard-after-normal-clear: true
    summon-costs:
      normal:
        - material: END_CRYSTAL
          amount: 4
      hard:
        - material: END_CRYSTAL
          amount: 4

revive:
  channel-seconds: 2.5
  interact-radius: 2.5
  require-sneak: true
  allow-right-click-hold: true
  invulnerability-seconds: 3.0
  heal-percent: 0.50
  void-rescue-y-offset: 2.0
  wipe-delay-seconds: 5
  wipe-if-all-leave-arena: true
  # If true, disconnecting during active combat transitions ALIVE -> DOWNED (otherwise state is preserved)
  down-on-disconnect: false

protection:
  # Prevent item & XP loss on raid death, void fall, or wipe
  keep-inventory-on-raid-death: true
  keep-experience-on-raid-death: true
  disable-bed-and-anchor-explosions: true
  protect-original-arena-terrain: true
  allow-temporary-blocks: true
  allow-water-buckets: true
  allow-ender-pearls: true
  allow-wind-charges: true
  max-temporary-blocks-per-player: 64
  max-temporary-blocks-total: 512
  rollback-temporary-blocks-on-end: true

visuals:
  use-packet-events: true
  aoe-update-interval-ticks: 2
  soul-marker-glow: true
  tether-particle-step: 0.5
  max-render-distance: 96.0
