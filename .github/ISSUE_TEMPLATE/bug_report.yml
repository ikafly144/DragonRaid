name: バグ報告 (Bug Report)
description: 不具合、Folia スレッド例外、ギミックの破綻等を報告します。
title: "[Bug] "
labels: ["type:bug"]
body:
  - type: input
    id: environment
    attributes:
      label: 実行環境
      description: MC バージョン、Folia ビルド、PacketEvents バージョン、Java バージョン
      placeholder: "MC 26.3 / Folia build xxx / PacketEvents x.x.x / Java 21+"
    validations:
      required: true
  - type: input
    id: players_difficulty
    attributes:
      label: 発生時の難易度・参加人数
      placeholder: "例: Hard/Savage / 4人"
  - type: textarea
    id: repro
    attributes:
      label: 再現手順
      validations:
        required: true
  - type: textarea
    id: expected_actual
    attributes:
      label: 期待される動作 vs 実際の動作
      validations:
        required: true
  - type: textarea
    id: logs
    attributes:
      label: エラーログ / スタックトレース
      render: text
