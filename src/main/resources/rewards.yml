custom-gear:
  dragonscale_shield:
    name-key: gear.dragonscale_shield.name
    lore-key: gear.dragonscale_shield.lore
    material: SHIELD
    custom-model-data: 1001
    stats:
      tank-buster-reduction-bonus: 0.20
      just-guard-shockwave-radius: 4.0
      just-guard-shockwave-damage: 6.0
      cooldown-seconds: 4.0

  voidwing_elytra:
    name-key: gear.voidwing_elytra.name
    lore-key: gear.voidwing_elytra.lore
    material: ELYTRA
    custom-model-data: 1002
    stats:
      glide-speed-multiplier: 1.25
      updraft-burst-velocity: 1.40
      cooldown-seconds: 12.0

  dragonslayer_greatsword:
    name-key: gear.dragonslayer_greatsword.name
    lore-key: gear.dragonslayer_greatsword.lore
    material: NETHERITE_SWORD
    custom-model-data: 1003
    stats:
      raid-damage-multiplier: 1.15
      cleave-damage: 10.0
      cleave-radius: 3.5
      cooldown-seconds: 8.0

  dragonslayer_bow:
    name-key: gear.dragonslayer_bow.name
    lore-key: gear.dragonslayer_bow.lore
    material: BOW
    custom-model-data: 1004
    stats:
      raid-damage-multiplier: 1.15
      crystal-damage-multiplier: 1.30
      piercing-shot-multiplier: 1.45
      cooldown-seconds: 10.0

  dragonslayer_mace:
    name-key: gear.dragonslayer_mace.name
    lore-key: gear.dragonslayer_mace.lore
    material: MACE
    custom-model-data: 1005
    stats:
      raid-damage-multiplier: 1.15
      smash-bonus-multiplier: 1.25
      extra-stagger-seconds: 1.0

  abyss_talisman:
    name-key: gear.abyss_talisman.name
    lore-key: gear.abyss_talisman.lore
    material: TOTEM_OF_UNDYING
    custom-model-data: 1006
    stats:
      auto-rescue-heal-percent: 0.50
      auto-rescue-invuln-seconds: 3.0
      cooldown-seconds: 300.0

