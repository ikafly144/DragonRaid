# DragonRaid Boss Configuration: Normal (3 Phases, ~5-7 min, ground-focused)

difficulty: NORMAL
display-name-key: boss.normal.name
base-hp: 1200.0
base-attack-damage: 8.0

revive:
  # PER_PLAYER = N * multiplier; HALF_CEIL = ceil(N * multiplier)
  formula: PER_PLAYER
  multiplier: 1.0
  # 0 = no downed expiration timer in Normal
  downed-timeout-seconds: 0

enrage:
  soft-enrage:
    enabled: true
    start-phase: final
    void-corruption-shrink-per-second: 0.25
    void-damage-per-second: 4.0
  hard-enrage:
    enabled: false
    time-limit-seconds: 600
    ability-name-key: ability.hard_enrage.name
    cast-seconds: 5.0

abilities:
  tank_buster:
    name-key: ability.tank_buster.name
    cast-seconds: 3.0
    damage: 24.0
    shield-damage-multiplier: 0.25
    just-guard-window-ticks: 10
    just-guard-damage-multiplier: 0.10
    stagger-seconds: 3.0
    telegraph-radius: 3.5
  stack:
    name-key: ability.stack.name
    cast-seconds: 4.5
    total-damage: 32.0
    radius: 4.5
  spread:
    name-key: ability.spread.name
    cast-seconds: 4.0
    damage: 14.0
    radius: 4.5
    overlap-penalty-multiplier: 2.0
  meteor_towers:
    name-key: ability.meteor_towers.name
    cast-seconds: 6.0
    tower-radius: 3.0
    soak-damage: 8.0
    unsoaked-raid-damage: 22.0
  los_breath:
    name-key: ability.los_breath.name
    cast-seconds: 4.0
    damage: 26.0
    range: 96.0
  crystals:
    name-key: ability.crystals.name
    base-hp: 80.0
    tether-enabled: false
    simultaneous-kill-window-seconds: 0.0
    boss-regen-per-second: 4.0

phases:
  - id: phase-1
    name-key: phase.p1.name
    hp-threshold-max: 1.00
    hp-threshold-min: 0.70
    timeline-speed: 1.0
    soft-enrage: false
    timeline:
      - delay-seconds: 5.0
        action: SPAWN_CRYSTALS
        ability: crystals
      - delay-seconds: 8.0
        action: TANK_BUSTER
        ability: tank_buster
      - delay-seconds: 10.0
        action: STACK
        ability: stack
      - delay-seconds: 10.0
        action: SPREAD
        ability: spread
      - delay-seconds: 12.0
        action: LOOP

  - id: phase-2
    name-key: phase.p2.name
    hp-threshold-max: 0.70
    hp-threshold-min: 0.40
    timeline-speed: 1.0
    soft-enrage: false
    timeline:
      - delay-seconds: 4.0
        action: METEOR_TOWERS
        ability: meteor_towers
      - delay-seconds: 10.0
        action: LOS_BREATH
        ability: los_breath
      - delay-seconds: 8.0
        action: SPAWN_CRYSTALS
        ability: crystals
      - delay-seconds: 10.0
        action: TANK_BUSTER
        ability: tank_buster
      - delay-seconds: 12.0
        action: LOOP

  - id: final
    name-key: phase.final.name
    hp-threshold-max: 0.40
    hp-threshold-min: 0.00
    timeline-speed: 1.15
    soft-enrage: true
    timeline:
      - delay-seconds: 4.0
        action: SPAWN_CRYSTALS
        ability: crystals
      - delay-seconds: 7.0
        action: STACK
        ability: stack
      - delay-seconds: 8.0
        action: SPREAD
        ability: spread
      - delay-seconds: 8.0
        action: LOS_BREATH
        ability: los_breath
      - delay-seconds: 7.0
        action: TANK_BUSTER
        ability: tank_buster
      - delay-seconds: 9.0
        action: LOOP
