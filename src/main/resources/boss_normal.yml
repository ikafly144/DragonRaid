# DragonRaid Boss Configuration: Normal (3 Phases, ~5-7 min, True Ending + MMO Action Mechanics)

difficulty: NORMAL
display-name-key: boss.normal.name
base-hp: 1200.0
base-attack-damage: 8.0

revive:
  # PER_PLAYER = N * multiplier; HALF_CEIL = ceil(N * multiplier)
  formula: PER_PLAYER
  multiplier: 1.0
  # 0 = no downed expiration timer in Normal
  downed-timeout-seconds: 0

enrage:
  soft-enrage:
    enabled: true
    start-phase: final
    void-corruption-shrink-per-second: 0.25
    void-damage-per-second: 4.0
  hard-enrage:
    enabled: false
    time-limit-seconds: 600
    ability-name-key: ability.hard_enrage.name
    cast-seconds: 5.0

abilities:
  tank_buster:
    name-key: ability.tank_buster.name
    cast-seconds: 3.0
    damage: 24.0
    shield-damage-multiplier: 0.25
    just-guard-window-ticks: 10
    just-guard-damage-multiplier: 0.10
    stagger-seconds: 3.0
    telegraph-radius: 3.5
  stack:
    name-key: ability.stack.name
    cast-seconds: 4.0
    total-damage: 32.0
    radius: 4.5
  ground_slam_dive:
    name-key: ability.ground_slam_dive.name
    cast-seconds: 4.0
    damage: 36.0
    min-damage: 4.0
    falloff-radius: 28.0
  lightning_storm:
    name-key: ability.lightning_storm.name
    cast-seconds: 3.2
    damage: 18.0
    radius: 3.5
    random-strikes: 6
  sweeping_laser:
    name-key: ability.sweeping_laser.name
    cast-seconds: 5.0
    damage: 24.0
    beam-width: 2.6
  shield_wall_breath:
    name-key: ability.shield_wall_breath.name
    cast-seconds: 4.5
    damage: 34.0
    shield-chip-multiplier: 0.20
    safe-cone-half-angle: 32.0
  fireball_barrage:
    name-key: ability.fireball_barrage.name
    cast-seconds: 3.6
    damage: 16.0
  enderman_eruption:
    name-key: ability.enderman_eruption.name
    cast-seconds: 3.5
    damage: 20.0
    radius: 3.4
    pattern: CHASING
  exaflare_waves:
    name-key: ability.exaflare_waves.name
    cast-seconds: 3.0
    damage: 22.0
  knockback_combo:
    name-key: ability.knockback_combo.name
    cast-seconds: 3.0
    damage: 10.0
    horizontal-impulse: 2.1
    vertical-impulse: 0.55
  spread:
    name-key: ability.spread.name
    cast-seconds: 4.0
    damage: 14.0
    radius: 4.5
    overlap-penalty-multiplier: 2.0
  meteor_towers:
    name-key: ability.meteor_towers.name
    cast-seconds: 6.0
    tower-radius: 3.0
    soak-damage: 8.0
    unsoaked-raid-damage: 22.0
  los_breath:
    name-key: ability.los_breath.name
    cast-seconds: 4.0
    damage: 26.0
    range: 96.0
  crystals:
    name-key: ability.crystals.name
    base-hp: 80.0
    tether-enabled: false
    simultaneous-kill-window-seconds: 0.0
    boss-regen-per-second: 4.0

phases:
  - id: phase-1
    name-key: phase.p1.name
    hp-threshold-max: 1.00
    hp-threshold-min: 0.70
    timeline-speed: 1.0
    soft-enrage: false
    timeline:
      - delay-seconds: 4.0
        action: SPAWN_CRYSTALS
        ability: crystals
      - delay-seconds: 7.0
        action: FIREBALL_BARRAGE
        ability: fireball_barrage
      - delay-seconds: 8.0
        action: DRAGON_DIVE_STACK
        ability: stack
      - delay-seconds: 8.0
        action: LIGHTNING_STORM
        ability: lightning_storm
      - delay-seconds: 8.0
        action: ENDERMAN_ERUPTION
        ability: enderman_eruption
      - delay-seconds: 10.0
        action: LOOP

  - id: phase-2
    name-key: phase.p2.name
    hp-threshold-max: 0.70
    hp-threshold-min: 0.40
    timeline-speed: 1.0
    soft-enrage: false
    timeline:
      - delay-seconds: 4.0
        action: SPAWN_CRYSTALS
        ability: crystals
      - delay-seconds: 7.0
        action: GROUND_SLAM_DIVE
        ability: ground_slam_dive
      - delay-seconds: 9.0
        action: SWEEPING_LASER
        ability: sweeping_laser
      - delay-seconds: 8.0
        action: SHIELD_WALL_BREATH
        ability: shield_wall_breath
      - delay-seconds: 8.0
        action: KNOCKBACK_COMBO
        ability: knockback_combo
      - delay-seconds: 10.0
        action: LOOP

  - id: final
    name-key: phase.final.name
    hp-threshold-max: 0.40
    hp-threshold-min: 0.00
    timeline-speed: 1.15
    soft-enrage: true
    timeline:
      - delay-seconds: 4.0
        action: SPAWN_CRYSTALS
        ability: crystals
      - delay-seconds: 6.0
        action: EXAFLARE_WAVES
        ability: exaflare_waves
      - delay-seconds: 7.0
        action: DRAGON_DIVE_STACK
        ability: stack
      - delay-seconds: 8.0
        action: SWEEPING_LASER
        ability: sweeping_laser
      - delay-seconds: 7.0
        action: SHIELD_WALL_BREATH
        ability: shield_wall_breath
      - delay-seconds: 7.0
        action: GROUND_SLAM_DIVE
        ability: ground_slam_dive
      - delay-seconds: 9.0
        action: LOOP
