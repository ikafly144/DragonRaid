  late-join-locked: "<prefix><yellow>A raid is currently in progress. Please wait in the safe zone until the attempt ends.</yellow>"
  wipe-title: "<dark_red><bold>WIPE</bold></dark_red>"
  wipe-subtitle: "<gray>Resetting the arena and returning everyone to the safe zone...</gray>"
  victory-title: "<gold><bold>VICTORY!</bold></gold>"
  victory-subtitle: "<yellow>Clear Time: <time> | Difficulty: <difficulty></yellow>"
  victory-rewards: "<prefix><green>Rewards earned: <rewards></green>"
  arena-protected: "<prefix><red>Original End terrain cannot be broken during the raid.</red>"
  bed-blocked: "<prefix><red>Beds and respawn anchors cannot be used during the raid.</red>"
  temp-block-limit: "<prefix><yellow>Temporary block placement limit (<limit>) reached.</yellow>"
  temp-block-disabled: "<prefix><red>Placing temporary blocks is disabled during the raid.</red>"
  water-bucket-blocked: "<prefix><red>Using water buckets is disabled during the raid.</red>"
