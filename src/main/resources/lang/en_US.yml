  stats-load-failed: "<prefix><red>Failed to load stats.</red>"
  help: "<prefix><gray>DragonRaid commands: <white>/dr shop, /dr stats [player], /dr ready, /dr start, /dr admin \\<region|start|reset|points|reload></white></gray>"
  milestone-shop: "<prefix><yellow>Reward shop GUI is not yet available (scheduled for Milestone 4).</yellow>"
  milestone-ready: "<prefix><yellow>Raid ready/encounter flow is not yet available (scheduled for Milestone 2).</yellow>"
  milestone-start: "<prefix><yellow>Raid encounter flow is not yet available (scheduled for Milestone 2).</yellow>"
  milestone-admin-start: "<prefix><yellow>Forced raid start (<difficulty>) is not yet available (scheduled for Milestone 2).</yellow>"
  milestone-admin-reset: "<prefix><yellow>Raid encounter reset is not yet available (scheduled for Milestone 2).</yellow>"
  invalid-usage: "<prefix><yellow>Usage: <usage></yellow>"
  reload-success: "<prefix><green>Configuration and language files reloaded.</green>"
  reload-failed: "<prefix><red>Failed to reload configuration: <error></red>"
  ready-toggled: "<prefix><aqua>Ready status: <state></aqua>"
