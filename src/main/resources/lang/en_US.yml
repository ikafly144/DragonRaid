  no-revives-left: "<prefix><red>No revives remaining for this attempt.</red>"
  expired-spectator: "<prefix><dark_red><player>'s revive timer expired — moved to spectator state.</dark_red>"
  downed-action-blocked: "<red>You are downed and cannot act. Wait for an ally to revive you.</red>"

