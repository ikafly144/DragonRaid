# DragonRaid Boss Configuration: Hard / Savage (4 Phases, ~8-12 min, Party Co-op Mechanics + Hard Enrage)

difficulty: HARD
display-name-key: boss.hard.name
base-hp: 2400.0
base-attack-damage: 12.0

revive:
  # ceil(N * 0.5) = ceil(N / 2)
  formula: HALF_CEIL
  multiplier: 0.5
  # Players not revived within 45s transition to DEAD_SPECTATOR
  downed-timeout-seconds: 45

enrage:
  soft-enrage:
    enabled: true
    start-phase: final
    void-corruption-shrink-per-second: 0.35
    void-damage-per-second: 6.0
  hard-enrage:
    enabled: true
    time-limit-seconds: 720
    ability-name-key: ability.hard_enrage.name
    cast-seconds: 5.0

abilities:
  tank_buster:
    name-key: ability.tank_buster.name
    cast-seconds: 2.5
    damage: 34.0
    shield-damage-multiplier: 0.25
    just-guard-window-ticks: 8
    just-guard-damage-multiplier: 0.10
    stagger-seconds: 3.0
    telegraph-radius: 4.0
  stack:
    name-key: ability.stack.name
    cast-seconds: 3.8
    total-damage: 44.0
    radius: 4.5
  ground_slam_dive:
    name-key: ability.ground_slam_dive.name
    cast-seconds: 3.5
    damage: 46.0
    min-damage: 6.0
    falloff-radius: 30.0
  lightning_storm:
    name-key: ability.lightning_storm.name
    cast-seconds: 2.8
    damage: 24.0
    radius: 3.8
    random-strikes: 10
  sweeping_laser:
    name-key: ability.sweeping_laser.name
    cast-seconds: 4.5
    damage: 32.0
    beam-width: 3.0
  shield_wall_breath:
    name-key: ability.shield_wall_breath.name
    cast-seconds: 4.0
    damage: 44.0
    shield-chip-multiplier: 0.20
    safe-cone-half-angle: 28.0
  fireball_barrage:
    name-key: ability.fireball_barrage.name
    cast-seconds: 3.2
    damage: 22.0
  enderman_eruption:
    name-key: ability.enderman_eruption.name
    cast-seconds: 3.0
    damage: 26.0
    radius: 3.6
    pattern: RING_CASCADE
  exaflare_waves:
    name-key: ability.exaflare_waves.name
    cast-seconds: 2.6
    damage: 28.0
  knockback_combo:
    name-key: ability.knockback_combo.name
    cast-seconds: 2.8
    damage: 14.0
    horizontal-impulse: 2.3
    vertical-impulse: 0.65
  enderman_rotating_beam:
    name-key: ability.enderman_rotating_beam.name
    cast-seconds: 3.5
    damage: 28.0
    sweep-degrees: 120.0
  dual_dive_dice:
    name-key: ability.dual_dive_dice.name
    cast-seconds: 4.2
    total-damage: 44.0
    radius: 4.5
  tether_dive_relay:
    name-key: ability.tether_dive_relay.name
    cast-seconds: 5.4
    damage: 20.0
    relay-hits: 3
    vulnerability-multiplier: 3.0
  spread:
    name-key: ability.spread.name
    cast-seconds: 3.5
    damage: 18.0
    radius: 5.0
    overlap-penalty-multiplier: 2.5
  meteor_towers:
    name-key: ability.meteor_towers.name
    cast-seconds: 5.5
    tower-radius: 3.0
    soak-damage: 10.0
    unsoaked-raid-damage: 30.0
  los_breath:
    name-key: ability.los_breath.name
    cast-seconds: 3.5
    damage: 36.0
    range: 112.0
  crystals:
    name-key: ability.crystals.name
    base-hp: 120.0
    tether-enabled: true
    simultaneous-kill-window-seconds: 6.0
    boss-regen-per-second: 6.0
  donut_outer_aoe:
    name-key: ability.donut_outer_aoe.name
    cast-seconds: 3.0
    inner-safe-radius: 10.0
    outer-radius: 38.0
    damage: 22.0
    follow-up-delay-seconds: 2.0
  knockback_roar:
    name-key: ability.knockback_roar.name
    cast-seconds: 2.8
    horizontal-impulse: 2.2
    vertical-impulse: 0.65
    damage: 10.0
  updraft_wind_field:
    name-key: ability.updraft_wind_field.name
    field-count: 6
    radius: 4.5
    upward-velocity: 1.35
    duration-seconds: 25.0
  celestial_crystals:
    name-key: ability.celestial_crystals.name
    base-hp: 150.0
    altitude-offset: 28.0
    mace-smash-bonus-multiplier: 2.5
    ranged-bow-multiplier: 0.65
    stagger-seconds: 4.0
    raid-cast-seconds: 30.0

phases:
  - id: phase-1
    name-key: phase.p1.name
    hp-threshold-max: 1.00
    hp-threshold-min: 0.70
    timeline-speed: 1.0
    soft-enrage: false
    timeline:
      - delay-seconds: 4.0
        action: SPAWN_TETHERED_CRYSTALS
        ability: crystals
      - delay-seconds: 6.5
        action: DUAL_DIVE_DICE
        ability: dual_dive_dice
      - delay-seconds: 7.5
        action: GROUND_SLAM_DIVE
        ability: ground_slam_dive
      - delay-seconds: 7.5
        action: ENDERMAN_ROTATING_BEAM
        ability: enderman_rotating_beam
      - delay-seconds: 8.0
        action: FIREBALL_BARRAGE
        ability: fireball_barrage
      - delay-seconds: 9.0
        action: LOOP

  - id: phase-2
    name-key: phase.p2.name
    hp-threshold-max: 0.70
    hp-threshold-min: 0.40
    timeline-speed: 1.05
    soft-enrage: false
    timeline:
      - delay-seconds: 4.0
        action: SPAWN_TETHERED_CRYSTALS
        ability: crystals
      - delay-seconds: 6.5
        action: TETHER_DIVE_RELAY
        ability: tether_dive_relay
      - delay-seconds: 8.0
        action: SWEEPING_LASER
        ability: sweeping_laser
      - delay-seconds: 7.5
        action: SHIELD_WALL_BREATH
        ability: shield_wall_breath
      - delay-seconds: 7.0
        action: KNOCKBACK_COMBO
        ability: knockback_combo
      - delay-seconds: 9.0
        action: LOOP

  - id: phase-3
    name-key: phase.p3.name
    hp-threshold-max: 0.40
    hp-threshold-min: 0.25
    timeline-speed: 1.1
    soft-enrage: false
    timeline:
      - delay-seconds: 3.0
        action: EXAFLARE_WAVES
        ability: exaflare_waves
      - delay-seconds: 7.0
        action: ENDERMAN_ROTATING_BEAM
        ability: enderman_rotating_beam
      - delay-seconds: 7.5
        action: DUAL_DIVE_DICE
        ability: dual_dive_dice
      - delay-seconds: 7.5
        action: ENDERMAN_ERUPTION
        ability: enderman_eruption
      - delay-seconds: 9.0
        action: LOOP

  - id: final
    name-key: phase.final.name
    hp-threshold-max: 0.25
    hp-threshold-min: 0.00
    timeline-speed: 1.25
    soft-enrage: true
    timeline:
      - delay-seconds: 3.0
        action: SPAWN_TETHERED_CRYSTALS
        ability: crystals
      - delay-seconds: 5.5
        action: EXAFLARE_WAVES
        ability: exaflare_waves
      - delay-seconds: 6.5
        action: TETHER_DIVE_RELAY
        ability: tether_dive_relay
      - delay-seconds: 6.5
        action: SWEEPING_LASER
        ability: sweeping_laser
      - delay-seconds: 6.0
        action: SHIELD_WALL_BREATH
        ability: shield_wall_breath
      - delay-seconds: 6.0
        action: DUAL_DIVE_DICE
        ability: dual_dive_dice
      - delay-seconds: 7.0
        action: LOOP
