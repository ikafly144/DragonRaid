# DragonRaid Boss Configuration: Hard / Savage (4 Phases, ~8-12 min, aerial + combo mechanics + hard enrage)

difficulty: HARD
display-name-key: boss.hard.name
base-hp: 2400.0
base-attack-damage: 12.0

revive:
  # ceil(N * 0.5) = ceil(N / 2)
  formula: HALF_CEIL
  multiplier: 0.5
  # Players not revived within 45s transition to DEAD_SPECTATOR
  downed-timeout-seconds: 45

enrage:
  soft-enrage:
    enabled: true
    start-phase: final
    void-corruption-shrink-per-second: 0.35
    void-damage-per-second: 6.0
  hard-enrage:
    enabled: true
    time-limit-seconds: 720
    ability-name-key: ability.hard_enrage.name
    cast-seconds: 5.0

abilities:
  tank_buster:
    name-key: ability.tank_buster.name
    cast-seconds: 2.5
    damage: 34.0
    shield-damage-multiplier: 0.25
    just-guard-window-ticks: 8
    just-guard-damage-multiplier: 0.10
    stagger-seconds: 3.0
    telegraph-radius: 4.0
  stack:
    name-key: ability.stack.name
    cast-seconds: 4.0
    total-damage: 44.0
    radius: 4.5
  spread:
    name-key: ability.spread.name
    cast-seconds: 3.5
    damage: 18.0
    radius: 5.0
    overlap-penalty-multiplier: 2.5
  meteor_towers:
    name-key: ability.meteor_towers.name
    cast-seconds: 5.5
    tower-radius: 3.0
    soak-damage: 10.0
    unsoaked-raid-damage: 30.0
  los_breath:
    name-key: ability.los_breath.name
    cast-seconds: 3.5
    damage: 36.0
    range: 112.0
  crystals:
    name-key: ability.crystals.name
    base-hp: 120.0
    tether-enabled: true
    simultaneous-kill-window-seconds: 6.0
    boss-regen-per-second: 6.0
  donut_outer_aoe:
    name-key: ability.donut_outer_aoe.name
    cast-seconds: 3.0
    inner-safe-radius: 10.0
    outer-radius: 38.0
    damage: 22.0
    follow-up-delay-seconds: 2.0
  knockback_roar:
    name-key: ability.knockback_roar.name
    cast-seconds: 2.8
    horizontal-impulse: 2.2
    vertical-impulse: 0.65
    damage: 10.0
  updraft_wind_field:
    name-key: ability.updraft_wind_field.name
    field-count: 6
    radius: 4.5
    upward-velocity: 1.35
    duration-seconds: 25.0
  celestial_crystals:
    name-key: ability.celestial_crystals.name
    base-hp: 150.0
    altitude-offset: 28.0
    mace-smash-bonus-multiplier: 2.5
    ranged-bow-multiplier: 0.65
    stagger-seconds: 4.0
    raid-cast-seconds: 30.0

phases:
  - id: phase-1
    name-key: phase.p1.name
    hp-threshold-max: 1.00
    hp-threshold-min: 0.70
    timeline-speed: 1.0
    soft-enrage: false
    timeline:
      - delay-seconds: 4.0
        action: SPAWN_TETHERED_CRYSTALS
        ability: crystals
      - delay-seconds: 7.0
        action: DONUT_OUTER_AOE
        ability: donut_outer_aoe
      - delay-seconds: 8.0
        action: TANK_BUSTER
        ability: tank_buster
      - delay-seconds: 8.0
        action: STACK
        ability: stack
      - delay-seconds: 8.0
        action: SPREAD
        ability: spread
      - delay-seconds: 10.0
        action: LOOP

  - id: phase-2
    name-key: phase.p2.name
    hp-threshold-max: 0.70
    hp-threshold-min: 0.40
    timeline-speed: 1.05
    soft-enrage: false
    timeline:
      - delay-seconds: 4.0
        action: TOWERS_AND_SPREAD
        ability: meteor_towers
      - delay-seconds: 9.0
        action: LOS_BREATH
        ability: los_breath
      - delay-seconds: 4.5
        action: KNOCKBACK_ROAR
        ability: knockback_roar
      - delay-seconds: 7.0
        action: SPAWN_TETHERED_CRYSTALS
        ability: crystals
      - delay-seconds: 8.0
        action: TANK_BUSTER
        ability: tank_buster
      - delay-seconds: 9.0
        action: LOOP

  - id: phase-3
    name-key: phase.p3.name
    hp-threshold-max: 0.40
    hp-threshold-min: 0.25
    timeline-speed: 1.1
    soft-enrage: false
    timeline:
      - delay-seconds: 2.0
        action: SPAWN_UPDRAFT_FIELDS
        ability: updraft_wind_field
      - delay-seconds: 3.0
        action: SPAWN_CELESTIAL_CRYSTALS
        ability: celestial_crystals
      - delay-seconds: 10.0
        action: DONUT_OUTER_AOE
        ability: donut_outer_aoe
      - delay-seconds: 12.0
        action: KNOCKBACK_ROAR
        ability: knockback_roar
      - delay-seconds: 10.0
        action: LOOP

  - id: final
    name-key: phase.final.name
    hp-threshold-max: 0.25
    hp-threshold-min: 0.00
    timeline-speed: 1.25
    soft-enrage: true
    timeline:
      - delay-seconds: 3.0
        action: SPAWN_TETHERED_CRYSTALS
        ability: crystals
      - delay-seconds: 5.5
        action: TOWERS_AND_SPREAD
        ability: meteor_towers
      - delay-seconds: 6.5
        action: DONUT_OUTER_AOE
        ability: donut_outer_aoe
      - delay-seconds: 6.5
        action: LOS_BREATH
        ability: los_breath
      - delay-seconds: 4.0
        action: KNOCKBACK_ROAR
        ability: knockback_roar
      - delay-seconds: 6.0
        action: TANK_BUSTER
        ability: tank_buster
      - delay-seconds: 7.0
        action: LOOP
